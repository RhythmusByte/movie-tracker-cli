[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-tracker-cli"
version = "0.1.0"
description = "CLI movie tracker using TMDB API"
requires-python = ">=3.10"

dependencies = [
    "requests",
    "python-dotenv",
    "rich"
]

[tool.setuptools]
py-modules = ["Application"]

[tool.setuptools.packages.find]
where = ["src"]